  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

it; }\n  .accent{ font-family:'Instrument Serif', serif; font-style:italic; font-weight:400; }\n\n  .noise{\n    position:absolute; inset:0; pointer-events:none; opacity:.5; mix-blend-mode:overlay;\n  }\n\n  .reveal{ opacity:0; transform:translateY(28px); transition:opacity .8s ease var(--d,0s), transform .8s ease var(--d,0s); }\n  .reveal.in{ opacity:1; transform:translateY(0); }\n\n  /* NAV */\n  nav{\n    position:fixed; top:0; left:0; right:0; z-index:100;\n    display:flex; justify-content:space-between; align-items:center;\n    padding:20px 6vw;\n    background:rgba(244,238,225,0.88);\n    backdrop-filter:blur(10px);\n    -webkit-backdrop-filter:blur(10px);\n    border-bottom:1px solid rgba(23,23,18,0.08);\n    color:var(--ink);\n  }\n  nav .logo{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; letter-spacing:0.02em; color:var(--ink);}\n  nav ul{ display:flex; gap:32px; list-style:none; font-size:12.5px; letter-spacing:0.06em; text-transform:uppercase;}\n  nav a{ text-decoration:none; opacity:0.75; transition:opacity .2s; color:var(--ink);}\n  nav a:hover{ opacity:1; color:var(--orange-2); }\n  .nav-toggle{ display:none; }\n  .nav-burger{\n    display:none; width:44px; height:44px; align-items:center; justify-content:center;\n    border:none; background:transparent; cursor:pointer; position:relative; z-index:110;\n  }\n  .nav-burger span, .nav-burger span::before, .nav-burger span::after{\n    content:''; position:absolute; width:22px; height:2px; background:var(--ink); transition:transform .25s ease, opacity .2s ease;\n  }\n  .nav-burger span::before{ transform:translateY(-7px); }\n  .nav-burger span::after{ transform:translateY(7px); }\n  .nav-toggle:checked ~ nav .nav-burger span{ background:transparent; }\n  .nav-toggle:checked ~ nav .nav-burger span::before{ transform:rotate(45deg); }\n  .nav-toggle:checked ~ nav .nav-burger span::after{ transform:rotate(-45deg); }\n\n  /* HERO */\n  .hero{\n    background: radial-gradient(120% 100% at 80% 0%, var(--green-deep-2) 0%, var(--green-deep) 60%);\n    color:var(--cream);\n    min-height:100vh;\n    display:flex; flex-direction:column; justify-content:center;\n    padding:0 6vw;\n    position:relative; overflow:hidden;\n  }\n  /* organic blobs instead of grid */\n  .hero::before{\n    content:'';\n    position:absolute; inset:-10%;\n    background:\n      radial-gradient(38% 32% at 82% 12%, rgba(229,106,46,0.20) 0%, rgba(229,106,46,0) 70%),\n      radial-gradient(46% 40% at 8% 88%, rgba(139,171,143,0.22) 0%, rgba(139,171,143,0) 72%),\n      radial-gradient(30% 26% at 92% 78%, rgba(201,217,195,0.14) 0%, rgba(201,217,195,0) 70%);\n    filter:blur(6px);\n    pointer-events:none;\n  }\n  /* subtle grain texture */\n  .hero::after{\n    content:'';\n    position:absolute; inset:0;\n    opacity:0.5; mix-blend-mode:overlay; pointer-events:none;\n    background-image:url(\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScxMjAnIGhlaWdodD0nMTIwJz48ZmlsdGVyIGlkPSduJz48ZmVUdXJidWxlbmNlIHR5cGU9J2ZyYWN0YWxOb2lzZScgYmFzZUZyZXF1ZW5jeT0nMC44NScgbnVtT2N0YXZlcz0nMicgc3RpdGNoVGlsZXM9J3N0aXRjaCcvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPScxMDAlJyBoZWlnaHQ9JzEwMCUnIGZpbHRlcj0ndXJsKCUyM24pJyBvcGFjaXR5PScwLjM1Jy8+PC9zdmc+\");\n  }\n\n  .hero-inner{ position:relative; z-index:2; width:100%; max-width:1180px; margin:0 auto; padding-top:70px; }\n\n  .hero-watermark{\n    position:absolute; left:50%; top:50%;\n    transform:translate(-50%,-50%) rotate(-7deg);\n    transition:transform .6s cubic-bezier(.2,.8,.2,1);\n    z-index:1; pointer-events:none; user-select:none; white-space:nowrap;\n    display:flex; align-items:baseline; line-height:0.86;\n  }\n  .hero:hover .hero-watermark{\n    transform:translate(-50%,-50%) rotate(-3deg) scale(1.05);\n  }\n  .hero-watermark .wm-bold{\n    font-family:'Space Grotesk', sans-serif; font-weight:700; letter-spacing:-0.03em;\n    font-size:clamp(130px, 21vw, 360px);\n    color:transparent; -webkit-text-stroke:1.5px rgba(201,217,195,0.18);\n    transition:-webkit-text-stroke-color .5s ease, transform .5s ease;\n  }\n  .hero:hover .hero-watermark .wm-bold{\n    -webkit-text-stroke-color:rgba(201,217,195,0.32);\n    transform:translateX(-6px);\n  }\n  .hero-watermark .wm-script{\n    font-family:'Instrument Serif', serif; font-style:italic; font-weight:400;\n    font-size:clamp(146px, 23vw, 400px);\n    color:rgba(229,106,46,0.28); -webkit-text-stroke:0;\n    margin-left:-0.06em; transform:rotate(-3deg) translateY(1%);\n    transition:color .5s ease, transform .5s ease;\n  }\n  .hero:hover .hero-watermark .wm-script{\n    color:rgba(229,106,46,0.5);\n    transform:rotate(-1deg) translateY(1%) translateX(8px);\n  }\n\n\n  .hero-eyebrow{\n    font-family:'Space Grotesk',sans-serif;\n    font-size:12px; letter-spacing:0.25em; text-transform:uppercase;\n    color:var(--sage-light);\n    margin-bottom:8px;\n    display:flex; align-items:center; gap:14px;\n    opacity:0; animation: fadeUp .8s ease forwards .1s;\n  }\n  .hero-eyebrow .dot{ width:6px; height:6px; border-radius:50%; background:var(--orange); display:inline-block; }\n\n  /* typographic lockup */\n  .hero-stage{ position:relative; padding:34px 0 8px; opacity:0; animation: fadeUp .9s ease forwards .25s; }\n  .hero-lockup{ position:relative; display:inline-block; line-height:0.86; }\n  .hero-name{\n    font-family:'Space Grotesk', sans-serif; font-weight:700; letter-spacing:-0.02em;\n    font-size: clamp(52px, 10vw, 132px); display:block; position:relative; z-index:2;\n  }\n  .hero-surname{\n    font-family:'Instrument Serif', serif; font-style:italic; font-weight:400; color:var(--orange);\n    font-size: clamp(58px, 11.5vw, 148px); display:block; position:relative; z-index:3;\n    margin-top:-0.18em; margin-left:0.28em; transform:rotate(-3deg);\n  }\n\n  .hero-badge-vol{\n    position:absolute; top:-6px; right:2%; z-index:4;\n    font-family:'Space Grotesk',sans-serif; font-size:11px; letter-spacing:0.12em; text-transform:uppercase;\n    color:var(--green-deep); background:var(--cream); border:1px solid rgba(23,23,18,0.08);\n    padding:9px 16px; border-radius:100px; transform:rotate(4deg);\n    box-shadow:0 10px 22px rgba(0,0,0,0.18);\n  }\n  .hero-role-tag{\n    position:relative; z-index:4; display:inline-flex; align-items:center; gap:8px; margin-top:14px;\n    font-family:'Space Grotesk',sans-serif; font-size:13px; letter-spacing:0.04em;\n    color:var(--sage-light); border:1px solid var(--line); padding:8px 16px 8px 10px; border-radius:100px;\n  }\n  .hero-role-tag .g{ font-family:'Instrument Serif',serif; font-style:italic; color:var(--orange); font-size:16px; }\n\n  .hero-swatches{\n    position:absolute; left:2px; bottom:-14px; z-index:4; display:flex; align-items:center; gap:10px;\n  }\n  .hero-swatches .chip{ width:20px; height:20px; border-radius:6px; box-shadow:0 3px 8px rgba(0,0,0,0.25); }\n  .hero-swatches .label{\n    font-family:'Space Grotesk',sans-serif; font-size:10.5px; letter-spacing:0.16em; text-transform:uppercase;\n    color:var(--sage-light); opacity:.65; margin-left:4px;\n  }\n\n  .hero-doodle{ position:absolute; top:-46px; left:-4%; width:210px; height:auto; opacity:.6; z-index:1; }\n  .hero-cursor{ position:absolute; width:26px; height:auto; z-index:5; filter:drop-shadow(0 4px 6px rgba(0,0,0,.3)); }\n\n  .hero-tags{\n    display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; position:relative; z-index:4;\n  }\n  .hero-tags span{\n    font-family:'Space Grotesk',sans-serif; font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase;\n    color:var(--sage-light); border:1px solid var(--line); padding:6px 13px; border-radius:100px; opacity:.8;\n  }\n  .hero-tags span:nth-child(2){ transform:rotate(-2deg); }\n  .hero-tags span:nth-child(3){ transform:rotate(1.5deg); }\n  .hero-tags span:nth-child(4){ transform:rotate(-1deg); }\n\n  .hero-sub{\n    max-width:540px; margin-top:34px; font-size:16.5px; line-height:1.6; color:var(--sage-light);\n    opacity:0; animation: fadeUp .9s ease forwards .4s;\n  }\n  .hero-cta{ margin-top:34px; display:flex; gap:16px; align-items:center; flex-wrap:wrap;\n    opacity:0; animation: fadeUp .9s ease forwards .55s; }\n  .btn{\n    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px;\n    padding:16px 30px; border-radius:100px; border:1px solid transparent; cursor:pointer;\n    text-decoration:none; display:inline-flex; align-items:center; gap:8px;\n    transition: transform .25s ease, background .25s ease, color .25s ease; background:none;\n  }\n  .btn-solid{ background:var(--orange); color:var(--cream); }\n  .btn-solid:hover{ transform:translateY(-2px); background:var(--orange-2); }\n  .btn-ghost{ border-color:var(--line); color:var(--cream); }\n  .btn-ghost.dark{ border-color:var(--line-dark); color:var(--ink); }\n  .btn-ghost:hover{ background:rgba(244,238,225,0.08); transform:translateY(-2px); }\n  .btn-ghost.dark:hover{ background:rgba(23,23,18,0.05); }\n\n  .hero-scroll{\n    position:absolute; bottom:36px; left:6vw;\n    font-family:'Space Grotesk',sans-serif; font-size:11px; letter-spacing:0.2em; text-transform:uppercase;\n    color:var(--sage-light); display:flex; align-items:center; gap:10px; opacity:0.7;\n  }\n  .hero-scroll .line{ width:36px; height:1px; background:var(--sage-light); position:relative; overflow:hidden;}\n  .hero-scroll .line::after{\n    content:''; position:absolute; left:-100%; top:0; width:100%; height:100%; background:var(--orange);\n    animation: slide 1.8s ease-in-out infinite;\n  }\n  @keyframes slide{ 0%{left:-100%;} 50%{left:0;} 100%{left:100%;} }\n\n  @media(max-width:820px){\n    .hero-badge-vol{ position:static; display:inline-block; transform:none; margin-bottom:14px; }\n    .hero-doodle, .hero-cursor{ display:none; }\n    .hero-swatches{ position:static; margin-top:16px; }\n    .hero-lockup{ display:block; }\n  }\n  @keyframes fadeUp{ from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:translateY(0);} }\n\n  .section-label{\n    font-family:'Space Grotesk',sans-serif; font-size:12px; letter-spacing:0.25em; text-transform:uppercase;\n    color:var(--orange-2); display:flex; align-items:center; gap:10px; margin-bottom:14px;\n  }\n  .section-label::before{ content:''; width:22px; height:1px; background:var(--orange-2); }\n  .section-label.on-dark{ color:var(--sage-light); }\n  .section-label.on-dark::before{ background:var(--sage-light); }\n\n  /* WORK */\n  .work{ padding:130px 6vw 0; background:var(--cream); }\n  .work-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:24px; flex-wrap:wrap; margin-bottom:56px; }\n  .work-head h2{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(34px,4.4vw,54px); letter-spacing:-0.01em; }\n  .work-head p{ max-width:340px; color:#4a4a3f; font-size:14.5px; line-height:1.6; }\n\n  .tabs{ position:sticky; top:58px; z-index:50; display:flex; gap:0; padding-top:18px; background:var(--cream); }\n  .tab{\n    font-family:'Space Grotesk',sans-serif; font-size:12.5px; letter-spacing:0.08em; text-transform:uppercase;\n    background:var(--cream-2); border:none; padding:14px 24px 16px; cursor:pointer; color:var(--ink);\n    position:relative; clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px);\n    margin-right:-14px; transition: transform .3s ease, background .3s ease, color .3s ease;\n    opacity:0.7; white-space:nowrap;\n  }\n  .tab:nth-child(1){ background:var(--cream-2); z-index:5;}\n  .tab:nth-child(2){ background:var(--sage-light); z-index:4;}\n  .tab:nth-child(3){ background:#a9c2ac; z-index:3;}\n  .tab:nth-child(4){ background:var(--sage); z-index:2;}\n  .tab:nth-child(5){ background:#5f7f66; color:var(--cream); z-index:1;}\n  .tab.active{ opacity:1; transform:translateY(-8px); box-shadow:0 -6px 16px rgba(15,43,33,0.12); }\n  .tab:hover{ opacity:1; }\n  .tabs-underline{ height:2px; background:var(--ink); }\n\n  .grid{ display:grid; grid-template-columns:repeat(6, 1fr); gap:2px; background:var(--cream); margin-top:2px; }\n  .card{\n    background:var(--cream-2); padding:36px 30px; min-height:300px; grid-column:span 2;\n    display:flex; flex-direction:column; justify-content:space-between; position:relative; overflow:hidden;\n    cursor:pointer; transition:background .35s ease;\n    text-decoration:none; color:inherit;\n  }\n  .card.feature{ grid-column:span 4; min-height:340px; }\n  .card:hover{ background:var(--sage-light); }\n  .card .idx{ position:absolute; top:26px; right:30px; font-family:'Space Grotesk',sans-serif; font-size:11px; opacity:.35; }\n  .card .meta-row{ display:flex; gap:8px; flex-wrap:wrap; }\n  .card .cat{\n    font-family:'Space Grotesk',sans-serif; font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase;\n    color:var(--orange-2); border:1px solid rgba(201,83,31,0.35); padding:4px 10px; border-radius:100px;\n  }\n  .card .tool{\n    font-family:'Space Grotesk',sans-serif; font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase;\n    color:#4a4a3f; border:1px solid var(--line-dark); padding:4px 10px; border-radius:100px;\n  }\n  .card .logo{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(24px,2.6vw,32px); margin:24px 0 10px; letter-spacing:-0.01em; }\n  .card .logo.serif{ font-family:'Instrument Serif', serif; font-style:italic; font-weight:400; font-size:1.25em; }\n  .card p{ font-size:13px; color:#4a4a3f; line-height:1.55; max-width:46ch; }\n  .card .arrow{\n    position:absolute; bottom:28px; right:28px; width:34px; height:34px; border-radius:50%;\n    border:1px solid var(--ink); display:flex; align-items:center; justify-content:center; font-size:14px;\n    transition: transform .35s ease, background .35s ease, color .35s ease;\n  }\n  .card:hover .arrow{ background:var(--orange); border-color:var(--orange); color:#fff; transform:rotate(45deg); }\n  .card.placeholder{ background:#eef3ea; border:1.5px dashed rgba(139,171,143,0.5); }\n  .card.placeholder:hover{ background:#e6ede1; }\n  .card.placeholder p{ opacity:.65; }\n  .card.banner{ grid-column:1 / -1; min-height:180px; flex-direction:row; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap; }\n  .card.banner p{ max-width:40ch; margin:0; }\n  @media(max-width:820px){ .card.banner{ flex-direction:column; align-items:flex-start; } }\n  .card.hide{ display:none; }\n\n  /* SERVICIOS */\n  .services{ padding:150px 6vw 130px; background:var(--cream); }\n  .svc-head{ margin-bottom:70px; max-width:640px; }\n  .svc-head h2{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(34px,4.4vw,54px); letter-spacing:-0.01em; margin-top:6px; }\n  .svc-list{ border-top:1px solid var(--line-dark); }\n  .svc-row{\n    display:grid; grid-template-columns:70px 1fr 1fr 40px; align-items:center; gap:24px;\n    padding:34px 6px; border-bottom:1px solid var(--line-dark);\n    transition:background .3s ease; cursor:default;\n  }\n  .svc-row:hover{ background:var(--cream-2); }\n  .svc-row .num{ font-family:'Space Grotesk',sans-serif; font-size:13px; color:#8a8a78; }\n  .svc-row h3{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:clamp(19px,2vw,26px); letter-spacing:-0.01em; }\n  .svc-row p{ font-size:14px; line-height:1.6; color:#4a4a3f; }\n  .svc-row .go{\n    width:36px; height:36px; border-radius:50%; border:1px solid var(--line-dark);\n    display:flex; align-items:center; justify-content:center; font-size:14px; justify-self:end;\n    transition:transform .3s ease, background .3s ease, color .3s ease, border-color .3s ease;\n  }\n  .svc-row:hover .go{ background:var(--orange); border-color:var(--orange); color:#fff; transform:rotate(45deg); }\n  @media(max-width:820px){\n    .svc-row{ grid-template-columns:40px 1fr 32px; }\n    .svc-row p{ grid-column:1 / -1; padding-left:40px; margin-top:4px; }\n  }\n\n  /* SOBRE MI */\n  .about{\n    background:var(--green-deep); color:var(--cream); padding:140px 6vw; position:relative; overflow:hidden;\n  }\n  .about::before{\n    content:''; position:absolute; inset:0;\n    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);\n    background-size:64px 64px; opacity:0.18; pointer-events:none;\n  }\n  .about-grid{ display:grid; grid-template-columns:0.9fr 1.1fr; gap:70px; position:relative; }\n  .about-quote{\n    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:clamp(26px,3vw,38px);\n    line-height:1.28; letter-spacing:-0.01em;\n  }\n  .about-quote .accent{ color:var(--orange); }\n  .about-body p{ font-size:15.5px; line-height:1.75; color:var(--sage-light); margin-bottom:22px; max-width:56ch; }\n  .about-chips{ display:flex; gap:10px; flex-wrap:wrap; margin-top:30px; }\n  .about-photo-wrap{ position:relative; width:230px; max-width:60%; margin-bottom:36px; }\n  .about-photo-frame{\n    position:absolute; inset:16px -16px -16px 16px; border:2px solid var(--orange);\n    border-radius:24px; transform:rotate(-4deg); z-index:0;\n  }\n  .about-photo{\n    position:relative; z-index:1; display:block; width:100%; aspect-ratio:1/1; object-fit:cover;\n    border-radius:22px; box-shadow:0 24px 48px rgba(0,0,0,0.38);\n  }\n  .about-tools{ margin-top:36px; display:flex; align-items:center; gap:18px; flex-wrap:wrap; }\n  .tools-label{\n    font-family:'Space Grotesk',sans-serif; font-size:11px; letter-spacing:0.14em; text-transform:uppercase;\n    color:var(--sage-light); opacity:.7;\n  }\n  .tool-badges{ display:flex; gap:10px; }\n  .tool-badge{\n    width:40px; height:40px; border-radius:11px; display:flex; align-items:center; justify-content:center;\n    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; color:#fff;\n    box-shadow:0 8px 16px rgba(0,0,0,0.28); transition:transform .3s ease;\n  }\n  .tool-badge:hover{ transform:translateY(-5px) rotate(-4deg); }\n  .tool-badge.illustrator{ background:#FF9A00; color:#1a1a1a; }\n  .tool-badge.photoshop{ background:#31A8FF; }\n  .tool-badge.affinity{ background:linear-gradient(135deg,#8A2BE2,#5B1FB0); }\n  .tool-badge.canva{ background:linear-gradient(135deg,#00C4CC,#7D2AE8); font-size:17px; }\n  .chip{\n    font-family:'Space Grotesk',sans-serif; font-size:11.5px; letter-spacing:0.1em; text-transform:uppercase;\n    border:1px solid var(--line); padding:9px 16px; border-radius:100px; color:var(--sage-light);\n  }\n  .about-note{\n    margin-top:36px; padding-top:26px; border-top:1px solid var(--line);\n    font-size:13px; color:var(--sage-light); opacity:.85; display:flex; gap:10px; align-items:baseline;\n  }\n  .about-note strong{ color:var(--cream); font-weight:600; }\n  @media(max-width:900px){ .about-grid{ grid-template-columns:1fr; gap:40px; } }\n\n  /* CONTACTO */\n  .contact{ background:var(--ink); color:var(--cream); padding:140px 6vw 90px; position:relative; }\n  .contact h2{\n    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(40px,7vw,92px); letter-spacing:-0.02em; line-height:1;\n    max-width:900px;\n  }\n  .contact-links{ margin-top:60px; display:flex; flex-direction:column; }\n  .contact-link{\n    display:flex; justify-content:space-between; align-items:center; padding:26px 4px;\n    border-top:1px solid rgba(244,238,225,0.14); text-decoration:none; color:var(--cream);\n    font-family:'Space Grotesk',sans-serif; font-size:clamp(18px,2.4vw,26px);\n    transition:padding-left .3s ease, color .3s ease;\n  }\n  .contact-link:last-child{ border-bottom:1px solid rgba(244,238,225,0.14); }\n  .contact-link:hover{ padding-left:16px; color:var(--orange); }\n  .contact-link span.small{ font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--sage-light); font-family:'Inter',sans-serif; }\n  .strip{\n    padding:26px 6vw; background:var(--ink); color:var(--sage-light);\n    font-family:'Space Grotesk',sans-serif; font-size:11px; letter-spacing:0.15em; text-transform:uppercase; text-align:center;\n    border-top:1px solid  Busso\">\n      <\u002Fdiv>\n      <div class=\"section-label on-dark\">Sobre mí<\u002Fdiv>\n      <p class=\"about-quote\">Soy autodidacta, curiosa y me estoy preparando para estudiar la carrera de <span class=\"accent\">Diseño Gráfico<\u002Fspan> — porque lo que empezó como pasión, quiero llevarlo más lejos.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"about-body reveal\">\n      <p>Me formé de manera autodidacta, a fuerza de cursos y de mucho trabajo real con clientes. Hoy me estoy preparando para dar el salto a la carrera de Diseño Gráfico y seguir profundizando lo que ya vengo haciendo hace tiempo.<\u002Fp>\n      <p>Lo que más me apasiona no es solo el resultado final, sino el proceso creativo en sí: pensar el concepto, probar tipografías, encontrar la paleta que le da sentido a una marca. Ahí es donde más disfruto.<\u002Fp>\n      <p>Trabajo de forma estratégica: antes de diseñar, entiendo el negocio. Y lo hago de manera cercana y colaborativa, acompañando a cada cliente paso a paso, para que el resultado final sea tan suyo como mío.<\u002Fp>\n      <div class=\"about-chips\">\n        <span class=\"chip\">Estratégica<\u002Fspan>\n        <span class=\"chip\">Cercana<\u002Fspan>\n        <span class=\"chip\">Colaborativa<\u002Fspan>\n        <span class=\"chip\">Autodidacta<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"about-note\">🎓 <span><strong>En camino:<\u002Fstrong> preparándome para estudiar la carrera de Diseño Gráfico.<\u002Fspan><\u002Fdiv>\n      <div class=\"about-tools\">\n        <span class=\"tools-label\">Trabajo con<\u002Fspan>\n        <div class=\"tool-badges\">\n          <span class=\"tool-badge illustrator\" title=\"Illustrator\">Ai<\u002Fspan>\n          <span class=\"tool-badge photoshop\" title=\"Photoshop\">Ps<\u002Fspan>\n          <span class=\"tool-badge affinity\" title=\"Affinity\">Af<\u002Fspan>\n          <span class=\"tool-badge canva\" title=\"Canva\">C<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv .transform = `translateY(${y*0.25}px) rotate(${p*18}deg) scale(${1 - p*0.12})`;\n      flameFloat.style.opacity = Math.max(0.9 - p*1.1, 0);\n    }\n    if(heroTags){\n      heroTags.style.transform = `translateY(${y*0.15}px)`;\n    }\n    if(flameWatermark){\n      const rect = flameWatermark.parentElement.getBoundingClientRect();\n      const visible = Math.max(0, Math.min(1, 1 - rect.top / window.innerHeight));\n      flameWatermark.style.transform = `rotate(${visible*12 - 6}deg) translateY(${(1-visible)*40}px)`;\n    }\n  }\n\n  let ticking = false;\n  window.addEventListener('scroll', ()=>{\n    if(!ticking){\n      requestAnimationFrame(()=>{\n        updateProgress();\n        updateParallax();\n        ticking = false;\n      });\n      ticking = true;\n    }\n  });\n  updateProgress();\n  updateParallax();\n\n  /* ---- cursor a medida (solo hover en elementos interactivos) ---- */\n  const cursorDot = document.getElementById('cursorDot');\n  const isTouch = matchMedia('(hover:none)').matches;\n  if(!isTouch){\n    window.addEventListener('mousemove', (e)=>{\n      cursorDot.style.left = e.clientX + 'px';\n      cursorDot.style.top = e.clientY + 'px';\n      cursorDot.classList.add('show');\n    });\n    document.querySelectorAll('.card, .tab, .btn, .contact-link, .svc-row').forEach(el=>{\n      el.addEventListener('mouseenter', ()=>cursorDot.classList.add('big'));\n      el.addEventListener('mouseleave', ()=>cursorDot.classList.remove('big'));\n    });\n    document.addEventListener('mouseleave', ()=>cursorDot.classList.remove('show'));\n  }\n<\u002Fscript>\n\n\n<a href=\"https://wa.me/5493512255860\" target=\"_blank\" rel=\"noopener\" class=\"wsp-float\" aria-label=\"WhatsApp\">\n  <svg viewBox=\"0 0 24 24\" width=\"28\" height=\"28\" fill=\"#fff\" style=\"position: fixed;\"><path d=\"M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.198.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-
